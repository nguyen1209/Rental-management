name: Test and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rental-production
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run application tests
        run: python test.py
        env:
          SECRET_KEY: github-actions-test-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: github-actions-test-password

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Google Cloud VM
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'set -e
             cd /home/thanhnguyen12092003/Rental-management
             git switch main
             git pull --ff-only origin main
             docker compose up --build -d
             docker compose ps
             for attempt in $(seq 1 45); do
               if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
                 echo "Application is healthy."
                 exit 0
               fi
               echo "Waiting for application startup ($attempt/45)..."
               sleep 2
             done
             echo "Application did not become healthy in time."
             docker compose ps
             docker compose logs --tail=100 web
             exit 1'
