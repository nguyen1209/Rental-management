services:
  postgres:
    image: postgres:17-alpine
    container_name: phuong-lan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create a .env file with POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: phuong-lan-rental
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Create a .env file with SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Create a .env file with ADMIN_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rental
      DB_USER: rental
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Create a .env file with POSTGRES_PASSWORD}
      UPLOAD_FOLDER: /app/static/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./uploads:/app/static/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
