{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Khách hàng</h2>
    <a href="/add-customer" class="btn btn-primary">+ Thêm khách hàng</a>
</div>
<table class="table table-bordered">
    <thead>
        <tr><th>ID</th><th>Tên</th><th>SĐT</th><th>Email</th><th>Địa chỉ</th><th>Thao tác</th></tr>
    </thead>
    <tbody>
        {% for c in customers %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.fullname }}</td>
            <td>{{ c.phone }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.address }}</td>
            <td><form method="post" action="{{ url_for('delete_customer', id=c.id) }}" class="inline-form" onsubmit="return confirm('Xóa khách hàng này?')"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="btn btn-danger btn-sm">Xóa</button></form></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
